version: '3.9'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: connectmes-mosquitto
    restart: unless-stopped
    ports:
      - "1886:1886"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - connectmes-bridge-net

  opcua-mqtt-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectmes-opcua-mqtt-bridge
    env_file:
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=production
      - BRIDGE_CERTS_DIR=/app/certs
      - MQTT_URL=mqtt://mosquitto:1886
    ports:
      - "${BRIDGE_WEB_PORT:-3400}:${BRIDGE_WEB_PORT:-3400}"
    depends_on:
      - mosquitto
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./certs:/app/certs
    restart: unless-stopped
    networks:
      - connectmes-bridge-net

networks:
  connectmes-bridge-net:
    driver: bridge
